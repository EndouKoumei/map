<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dự báo mùa bão 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", "Segoe UI", Arial, sans-serif; background: #0b1828; color: #e2e8f0; min-height: 100vh; }
    .hero { padding: 20px 24px 14px; border-bottom: 1px solid #1e3a5f; background: linear-gradient(180deg, #13243a, #0f1d30); }
    .hero h1 { font-size: 22px; margin-bottom: 4px; }
    .hero p { color: #7fa8d0; font-size: 13px; line-height: 1.5; max-width: 980px; }
    .wrap { padding: 18px 24px 28px; max-width: 1440px; margin: 0 auto; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi, .panel { background: #102238; border: 1px solid #1e3a5f; border-radius: 8px; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
    .kpi { padding: 14px; }
    .kpi-num { font-size: 24px; font-weight: 800; color: #60a5fa; }
    .kpi-label { font-size: 12px; color: #7fa8d0; margin-top: 3px; }
    .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; align-items: start; margin-bottom: 14px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .panel { padding: 14px; min-height: 260px; }
    .panel h2 { font-size: 14px; margin-bottom: 10px; color: #dbeafe; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #1e3a5f; text-align: left; vertical-align: top; }
    th { color: #7fa8d0; font-weight: 700; }
    td.num, th.num { text-align: right; }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; background: #19395d; color: #bfdbfe; font-size: 11px; font-weight: 700; }
    .note { color: #7fa8d0; font-size: 12px; line-height: 1.55; background: #0d1e30; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; }
    .loading { padding: 30px; color: #7fa8d0; }
    canvas { width: 100%; max-height: 320px; }
    @media (max-width: 980px) {
      .kpis, .grid, .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  {% include "partials/navbar.html" %}

  <section class="hero">
    <h1>Dự báo xác suất mùa bão 2026</h1>
    <p>
      Mô hình thống kê đơn giản từ lịch sử IBTrACS, kết hợp kịch bản ENSO/SST 2026.
      Kết quả là outlook theo tháng, không thay thế dự báo chính thức của cơ quan khí tượng.
    </p>
  </section>

  <main class="wrap" id="app"><div class="loading">Đang tải dự báo mùa bão...</div></main>

<script>
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#1e3a5f';

function pct(v) { return `${Math.round((Number(v) || 0) * 100)}%`; }
function num(v) { return Number(v || 0).toLocaleString('vi-VN', { maximumFractionDigits: 2 }); }

function best(probMap) {
  return Object.values(probMap || {}).sort((a, b) => b.probability - a.probability)[0] || { label: 'N/A', probability: 0 };
}

async function loadForecast() {
  const res = await fetch('/api/seasonal-forecast?year=2026');
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  render(data);
}

function render(data) {
  const months = data.months;
  const seasonTotal = months.reduce((sum, m) => sum + Number(m.expected_storms || 0), 0);
  const peak = [...months].sort((a, b) => b.expected_storms - a.expected_storms)[0];
  const elNinoMonths = months.filter(m => String(m.climate.enso_phase || '').toLowerCase().includes('nino')).length;

  document.getElementById('app').innerHTML = `
    <section class="kpis">
      <div class="kpi"><div class="kpi-num">${num(seasonTotal)}</div><div class="kpi-label">Tổng số cơn kỳ vọng cả năm</div></div>
      <div class="kpi"><div class="kpi-num">T${peak.month}</div><div class="kpi-label">Tháng rủi ro cao nhất theo model</div></div>
      <div class="kpi"><div class="kpi-num">${elNinoMonths}/12</div><div class="kpi-label">Tháng có kịch bản El Niño</div></div>
      <div class="kpi"><div class="kpi-num">v1</div><div class="kpi-label">Climatology + ENSO/SST scenario</div></div>
    </section>

    <section class="grid">
      <div class="panel"><h2>Số cơn bão kỳ vọng theo tháng</h2><canvas id="countChart"></canvas></div>
      <div class="panel"><h2>Xác suất số cơn trong tháng cao điểm</h2><canvas id="probChart"></canvas></div>
    </section>

    <section class="charts">
      <div class="panel"><h2>Vùng hình thành có xác suất cao nhất</h2><canvas id="genesisChart"></canvas></div>
      <div class="panel"><h2>Vùng ảnh hưởng/đổ bộ gần VN có xác suất cao nhất</h2><canvas id="landfallChart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Bảng outlook theo tháng</h2>
      <table>
        <thead>
          <tr>
            <th>Tháng</th><th>ENSO</th><th class="num">ONI</th><th class="num">Số cơn kỳ vọng</th>
            <th>Vùng hình thành chính</th><th>Vùng ảnh hưởng chính</th><th>Xác suất số cơn</th>
          </tr>
        </thead>
        <tbody>${months.map(m => {
          const g = best(m.genesis_region_probabilities);
          const l = best(m.landfall_region_probabilities);
          const cp = m.count_probabilities;
          return `<tr>
            <td><span class="pill">T${m.month}</span></td>
            <td>${m.climate.enso_phase || 'Neutral'}</td>
            <td class="num">${num(m.climate.oni)}</td>
            <td class="num">${num(m.expected_storms)}</td>
            <td>${g.label} (${pct(g.probability)})</td>
            <td>${l.label} (${pct(l.probability)})</td>
            <td>0: ${pct(cp['0'])}, 1: ${pct(cp['1'])}, 2: ${pct(cp['2'])}, 3+: ${pct(cp['3+'])}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </section>

    <div class="note">
      Nguồn: ${data.sources.join('; ')}.
      Giới hạn: ${data.limitations.join(' ')}
    </div>`;

  drawCount(months);
  drawPeakProb(peak);
  drawBestRegion('genesisChart', months, 'genesis_region_probabilities');
  drawBestRegion('landfallChart', months, 'landfall_region_probabilities');
}

function drawCount(months) {
  new Chart(document.getElementById('countChart'), {
    type: 'bar',
    data: { labels: MONTHS, datasets: [{ label: 'Số cơn kỳ vọng', data: months.map(m => m.expected_storms), backgroundColor: '#60a5facc' }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } },
  });
}

function drawPeakProb(month) {
  const labels = ['0 cơn', '1 cơn', '2 cơn', '3+ cơn'];
  const values = ['0', '1', '2', '3+'].map(k => month.count_probabilities[k]);
  new Chart(document.getElementById('probChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: ['#1e3a5f', '#60a5fa', '#22c55e', '#f87171'] }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' }, title: { display: true, text: `Tháng ${month.month}` } } },
  });
}

function drawBestRegion(canvasId, months, field) {
  const labels = months.map(m => `T${m.month}`);
  const values = months.map(m => best(m[field]).probability);
  const names = months.map(m => best(m[field]).label);
  new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Xác suất vùng chính', data: values, borderColor: '#facc15', backgroundColor: '#facc1533', fill: true, tension: .35 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: ctx => `${names[ctx.dataIndex]}: ${pct(ctx.raw)}` } },
      },
      scales: { y: { beginAtZero: true, max: 1, ticks: { callback: v => pct(v) } } },
    },
  });
}

loadForecast().catch(err => {
  document.getElementById('app').innerHTML = `<div class="loading" style="color:#f87171">Không tải được dự báo: ${err.message}</div>`;
});
</script>
</body>
</html>
